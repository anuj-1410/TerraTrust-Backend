[project]
name = "terratrust-backend"
version = "3.1.0"
description = "Autonomous carbon credit verification for Indian smallholder farmers."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",

    # --- Firebase / Supabase ---
    "firebase-admin>=7.6,<8",
    "supabase>=2.31.0",

    # --- Database ---
    "SQLAlchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",

    # --- Geospatial ---
    "shapely>=2.1.2",

    # --- Google Earth Engine ---
    "earthengine-api>=1.7.43",

    # --- SAR / Remote Sensing ---
    "asf-search>=8.0,<15",

    # --- Numerical / Scientific ---
    # numpy>=2.1 required for Python 3.13 (1.x has no 3.13 wheels)
    "numpy>=2.2.6",
    "scipy>=1.15.3",

    # --- Computer Vision ---
    "opencv-python-headless>=4.11.0.86",
    "Pillow>=12.1.1",

    # --- Google Cloud ---
    "google-cloud-vision>=3.15.0",

    # --- Machine Learning ---
    "xgboost>=3.0.2",
    "scikit-learn>=1.6.1",

    # --- Task Queue ---
    "celery>=5.6.2",
    "flower>=2.0.1",
    "redis>=6.2.0",

    # --- Process Manager ---
    "honcho>=1.1.0",

    # --- Blockchain / Web3 ---
    "web3>=7.14.1",
    "eth-account>=0.13.7",

    # --- HTTP Client ---
    "httpx>=0.28.1",

    # --- Browser Automation ---
    "playwright>=1.50,<2",

    # --- Pydantic ---
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",

    # --- Misc ---
    "sniffio>=1.3.1",
    "setuptools>=84.0.0",
]

# ---------------------------------------------------------------------------
# Dev dependencies (PEP 735 dependency groups -- replaces tool.uv.dev-dependencies)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

# ---------------------------------------------------------------------------
# pytest -- replaces deleted pytest.ini
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-p no:pytest_ethereum"
testpaths = ["tests"]